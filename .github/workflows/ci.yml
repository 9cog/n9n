name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ── Lua syntax check ──────────────────────────────────────────────────────
  lint:
    name: Lua Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LuaJIT
        run: sudo apt-get install -y luajit

      - name: Check Lua syntax (project files)
        run: |
          set -e
          # Check all project Lua files, excluding vendor directories and
          # known pre-existing stub files (Limbo stubs / incomplete skeletons).
          KNOWN_BROKEN="./fs/appl/listen.lua ./fs/appl/styxlisten.lua ./fs/appl/ls.lua"
          find . \
            \( -path './LuaJIT-2.0.4' \
               -o -path './luajit' \
               -o -path './libuv' \
               -o -path './libuv-1.6.1' \
               -o -path './.git' \
            \) -prune -o \
            -name '*.lua' -type f -print \
          | sort \
          | while read -r f; do
              # Skip known pre-existing broken stubs
              case "$KNOWN_BROKEN" in *"$f"*) echo "SKIP $f"; continue ;; esac
              luajit -b "$f" /dev/null 2>&1 && echo "  ok  $f" || { echo "FAIL $f"; exit 1; }
            done

  # ── Unit / e2e tests (LuaJIT, no build required) ─────────────────────────
  test-lua:
    name: Lua Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install LuaJIT
        run: sudo apt-get install -y luajit

      - name: Run test suite
        run: |
          LUA_PATH="./fs/os/lib/?.lua;./fs/os/lib/?/init.lua;;" \
          luajit fs/appl/run_tests.lua

      - name: Run legacy torch library tests
        run: |
          LUA_PATH="./fs/os/lib/?.lua;./fs/os/lib/?/init.lua;;" \
          luajit test_torch_libs.lua

  # ── Full binary build (Linux) ─────────────────────────────────────────────
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential \
            gcc \
            make \
            automake \
            autoconf \
            libtool \
            pkg-config

      - name: Build LuaJIT
        working-directory: luajit
        run: make -j$(nproc) BUILDMODE=static

      - name: Build libuv
        working-directory: libuv
        run: |
          sh autogen.sh
          ./configure --disable-shared --enable-static
          make -j$(nproc)

      - name: Build Node9 (debug)
        run: make config=debug_linux -j$(nproc)

      - name: Verify binary exists
        run: |
          ls -lh src/build/node9 || ls -lh bin/node9
          echo "Build succeeded."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: node9-linux-debug
          path: |
            src/build/node9
            bin/node9
          if-no-files-found: warn
          retention-days: 7

  # ── Summary ───────────────────────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [ lint, test-lua, build-linux ]
    if: always()
    steps:
      - name: Report status
        run: |
          echo "lint:        ${{ needs.lint.result }}"
          echo "test-lua:    ${{ needs.test-lua.result }}"
          echo "build-linux: ${{ needs.build-linux.result }}"
          if [ "${{ needs.lint.result }}"      != "success" ] || \
             [ "${{ needs.test-lua.result }}"  != "success" ]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All required jobs passed."
