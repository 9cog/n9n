name: AI-Powered Code Evolve

# This workflow demonstrates using MOD_TOKEN from repository secrets
# MOD_TOKEN is configured in GitHub repository secrets for Actions
# (GitHub Copilot uses MODEL_TOKEN from environment secrets)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ai-evolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: AI Code Evolve
        env:
          # MOD_TOKEN is available from repository secrets
          MOD_TOKEN: ${{ secrets.MOD_TOKEN }}
          # Set MODEL_PROVIDER to 'openai', 'github', or 'copilot'
          # For GitHub Copilot: use MODEL_PROVIDER: github (or copilot)
          # For OpenAI: use MODEL_PROVIDER: openai (default)
          MODEL_PROVIDER: openai
          MODEL_NAME: gpt-4o
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          echo "Running AI-powered code evolve..."
          echo "MOD_TOKEN is configured: ${MOD_TOKEN:+YES}"
          
          # Set default base branch to 'main' if GITHUB_BASE_REF is not set (e.g., on push events)
          : "${GITHUB_BASE_REF:=main}"
          echo "Base branch: $GITHUB_BASE_REF"
          
          # Fetch the base branch to ensure we can compare against it
          if ! git fetch origin "$GITHUB_BASE_REF"; then
            echo "Error: Failed to fetch base branch: $GITHUB_BASE_REF"
            exit 1
          fi
          
          # Get all Lua files in the repository, excluding vendor/third-party code
          # Exclude: LuaJIT-2.0.4, libuv, Penlight (pl), and dynasm directories
          # Using -prune to avoid descending into excluded directories for efficiency
          echo "Scanning for Lua files to evolve..."
          all_lua_files=$(find . \
            \( -path './LuaJIT-2.0.4' -o -path './libuv' -o -path './fs/os/lib/pl' -o -path './dynasm' \) -prune -o \
            -name '*.lua' -type f -print \
            | sort)
          
          if [ -z "$all_lua_files" ]; then
            echo "No Lua files found for evolution"
            exit 0
          fi
          
          echo "Found $(echo "$all_lua_files" | wc -l) Lua files (excluding vendor code)"
          
          # Select the most critical files for evolution
          # Priority: Core system files, modules, and applications
          critical_files=$(echo "$all_lua_files" | grep -E '(^./src/|^./fs/appl/|^./fs/module/|^./fs/os/lib/torch/)')
          
          # If no critical files match the priority patterns, use the first 5 files as fallback
          if [ -z "$critical_files" ]; then
            critical_files=$(echo "$all_lua_files" | head -5)
          fi
          
          if [ -n "$critical_files" ]; then
            echo "Selected critical Lua files for evolution:"
            echo "$critical_files"
            
            # Install required Python dependencies
            pip3 install pyyaml --quiet
            
            # Make evolve script executable
            chmod +x evolve_file.py
            
            # Evolve each file using the code_evolve prompt from node9.prompt.yml
            for file in $critical_files; do
              echo "Evolving $file..."
              python3 evolve_file.py "$file" || echo "⚠ Failed to evolve $file"
            done
            
            # Check if any files were modified
            if git diff --quiet; then
              echo "No changes made during evolution"
            else
              echo "Files were evolved successfully"
              git diff --stat
            fi
          else
            echo "No critical Lua files identified for evolution"
          fi
      
      - name: Comment PR
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "AI evolve complete"
          # Add PR comment with evolve results if desired
